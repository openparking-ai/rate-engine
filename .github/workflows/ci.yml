name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: No real personal data in the repository
        # The self-test first: before trusting the result, prove the check can
        # fail. It plants a real-looking address and requires a rejection.
        run: |
          node .github/scripts/check-no-real-data.js --self-test
          node .github/scripts/check-no-real-data.js

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest version supported and a current one. Nothing here may
        # quietly depend on a newer interpreter than an integrator's.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: This module has no dependencies, and that is a published claim
        # `pip install -e .` with no extras must leave nothing but the package
        # itself. A dependency arriving here is a dependency in every
        # integrator's build, and the README says there are none.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          requires = md.distribution("openparking-rate-engine").requires or []
          runtime = [r for r in requires if "extra ==" not in r]
          assert runtime == [], f"the runtime dependency list is no longer empty: {runtime}"
          print("no runtime dependencies, as published")
          PY

      - name: The suite
        # No allowance is named. This module has no optional dependency, no
        # weights and no hardware, so nothing in it has a legitimate reason to
        # skip -- and a guarantee that did not run and pass fails this step.
        run: pytest -q

      - name: The CLI works with nothing installed but this package
        # The definition of done, as a check: someone with no parking system
        # points this at a plan and gets a priced stay back.
        run: |
          rate-engine quote --plan tests/plans/downtown_v2.json \
            --entry 2026-03-03T09:14:00-05:00 --exit 2026-03-03T18:40:00-05:00 \
            --space-class standard --currency USD
          rate-engine validate-plan --plan tests/plans/downtown_v2.json

  controls:
    name: controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'

      - name: Anchor pre-flight
        # Each fail-control plants a string into a source file. Editing the line
        # an anchor sits on silently retires the control that depends on it, and
        # the suite then passes while the control measures nothing. This answers
        # that whole failure mode in a second, before the controls themselves
        # run -- and it is a separate step so a failure here is visible as one.
        run: python scripts/fail_controls.py --anchors

      - name: Every guarantee, proven able to FAIL
        # Breaks the thing each guarantee guards and requires red. A test that
        # has never failed is a decoration. This step is what makes the eight
        # guarantees in docs/CONTRACT.md measured rather than asserted.
        run: python scripts/fail_controls.py

      - name: The working tree is unchanged after planting eight defects
        # Every plant restores in a `finally` and verifies the bytes. This is the
        # independent check on that: a control that left a defect behind would
        # otherwise be discovered by whatever ran next.
        run: git diff --exit-code

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'

      - name: Every published figure AND SENTENCE is still the generated one
        # docs/CONTRACT.md's marked blocks are DERIVED -- the rule types from the
        # registry, the gap codes from findings.py, the guarantees from the test
        # registry, and the worked example by running the engine and printing
        # what it returned. A number or a sentence edited by hand turns this red.
        run: |
          python scripts/generate_contract.py --check
          git diff --exit-code docs/CONTRACT.md

      - name: Generation is not verification
        # The step above proves the document matches the generator. It cannot
        # prove the generator DERIVES anything -- a template whose prose is fixed
        # everywhere except the holes agrees with itself perfectly. These tests
        # plant values that contradict the prose and require the prose to change.
        run: pytest tests/test_contract_is_generated.py -q
